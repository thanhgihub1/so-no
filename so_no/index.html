<style>

  body { background: #f3f1ea; color: #222; min-height: 100vh;

  .hd .sub { opacity: .85; font-size: 14px; }
  .hd .sync { font-size: 12px; opacity: .8; margin-top: 4px; }
  .hd .lock { position: absolute; right: 14px; top: 14px;

              padding: 8px 10px; border-radius: 10px; font-size: 18px; }

  .search { padding: 10px 14px 4px; display: flex; gap: 8px; }
  .search input { flex: 1; padding: 13px 14px; font-size: 17px;
                  border-radius: 12px; border: 1px solid #ccc;
                  background: #fff; }
  .search select { padding: 0 8px; font-size: 15px; border-radius: 12px;
                   border: 1px solid #ccc; background: #fff; }
  .tools { display: flex; gap: 8px; padding: 8px 14px 6px; }
  .tools button { flex: 1; padding: 10px; font-size: 14px;

                 font-weight: 700; }
  .b-qh { background: #8b1a1a; color: #fff; }
  .b-ok { background: #d3f8d3; color: #1a7f37; }
  .b-lai { background: #fff3cd; color: #7a5800; }

           font-size: 17px; }
  .fab2 { position: fixed; left: 0; right: 0; bottom: 0;
          display: flex; gap: 12px; padding: 12px 14px 20px;

                 font-weight: 800; border: 0; border-radius: 16px;

  .ov { position: fixed; inset: 0; background: #0008; z-index: 30;
        display: none; }
  .ov.on { display: flex; align-items: flex-end; }
  .sheet { background: #fff; width: 100%; border-radius: 18px 18px 0 0;

  .sheet h2 { font-size: 21px; margin-bottom: 12px; }
  .sheet label { font-size: 15px; font-weight: 600; color: #444;
                 display: block; margin: 10px 0 4px; }

                 border: 1.5px solid #ccc; border-radius: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { padding: 10px 13px; border-radius: 20px;

  .chip.on { background: #0f5132; color: #fff; border-color: #0f5132; }
  .sheet .row { display: flex; gap: 10px; }

<script>
// ── dữ liệu ─────────────────────────────────────────────────
const KEY = 'sono_v1', PKEY = 'sono_pending', SKEY = 'sono_sync_url',
      PINK = 'sono_pin', PHK = 'sono_phones';
let DB = [];
try { DB = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
let PENDING = new Set(JSON.parse(localStorage.getItem(PKEY) || '[]'));
let PHONES = {};
try { PHONES = JSON.parse(localStorage.getItem(PHK) || '{}'); } catch (e) {}
const save = () => {
  localStorage.setItem(KEY, JSON.stringify(DB));
  localStorage.setItem(PKEY, JSON.stringify([...PENDING]));
  localStorage.setItem(PHK, JSON.stringify(PHONES));
  upSync(); trySync();
};
const pend = id => PENDING.add(id);
const LIVE = () => DB.filter(t => !t.xoa);

const fmt = n => Math.round(n).toLocaleString('vi-VN') + ' ₫';
const fmtShort = n => n >= 1e6
  ? (n / 1e6).toLocaleString('vi-VN', {maximumFractionDigits: 2}) + 'tr'
  : fmt(n);
const qEl = document.getElementById('q');
const norm = s => (s || '').toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
const nkey = s => norm(s).replace(/\s+/g, '');
const today = () => new Date().toISOString().slice(0, 10);
const thisMonth = () => today().slice(0, 7);
const d2v = d => d ? new Date(d + 'T12:00:00') : null;
const dday = d => {
  if (!d) return '';
  const [y, m, x] = d.split('-');
  return `${x}/${m}/${y}`;
};
const ICON = {gas: '⛽', tien: '💵', khac: '🧺'};
let xemHetFlg = false;

function toast(s) {
  const t = document.getElementById('toast');
  t.textContent = s; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(
    () => t.style.display = 'none', 2200);
}

// ── gom nhóm & tính toán ────────────────────────────────────
// FIFO: tiền trả trừ vào khoản cũ trước
function gocCon(items) {
  const no = items.filter(t => t.loai === 'no')
    .sort((a, b) => (a.ngay + a.gio).localeCompare(b.ngay + b.gio))
    .map(t => ({t, con: t.tien}));
  let tra = items.filter(t => t.loai === 'tra')
    .reduce((s, t) => s + t.tien, 0);
  for (const k of no) {
    const tru = Math.min(k.con, tra);
    k.con -= tru; tra -= tru;
    if (tra <= 0) break;
  }
  return no;
}
function laiTichLuy(items) {
  let s = 0;
  const now = Date.now();
  gocCon(items).forEach(({t, con}) => {
    const lai = +t.lai || 0;
    if (!con || !lai) return;
    const ngay = d2v(t.ngay);
    if (!ngay) return;
    s += con * lai / 100 * ((now - ngay) / 30.44 / 864e5);
  });
  return s;
}
function nhom() {
  const m = {};
  LIVE().forEach(t => {
    const k = nkey(t.ten);
    if (!m[k]) m[k] = {ten: t.ten, vay: 0, tra: 0, items: [], k,
                       sdt: '', han: '', cn: ''};
    m[k].items.push(t);
    if (t.loai === 'no') m[k].vay += t.tien; else m[k].tra += t.tien;
    if (t.sdt) m[k].sdt = t.sdt;
    if (t.loai === 'no' && t.han) m[k].han = t.han;
    if (t.cn) m[k].cn = t.cn;
    m[k].last = t.ngay + ' ' + (t.gio || '');
  });
  const out = Object.values(m);
  out.forEach(p => {
    if (PHONES[p.k] && !p.sdt) p.sdt = PHONES[p.k];
    p.con = p.vay - p.tra;
    p.lai = laiTichLuy(p.items);
    p.qh = (p.con > 0 && p.han && p.han < today())
      ? Math.round((d2v(today()) - d2v(p.han)) / 864e5) : 0;
    p.items.sort((a, b) =>
      (b.ngay + b.gio).localeCompare(a.ngay + a.gio));
  });
  const sx = document.getElementById('sx').value;
  const cmp = {
    qh:  (a, b) => (b.qh - a.qh) || (b.con - a.con),
    con: (a, b) => (b.con - a.con),
    new: (a, b) => b.last.localeCompare(a.last),
    ten: (a, b) => a.ten.localeCompare(b.ten, 'vi'),
  }[sx] || ((a, b) => b.con - a.con);
  return out.sort(cmp);
}

// ── bảng tổng quan ──────────────────────────────────────────
function tqHien() {
  const el = document.getElementById('tq');
  if (el.classList.toggle('on')) { el.classList.remove('on'); return; }
  const all = nhom();
  const no = all.filter(p => p.con > 0);
  const tong = no.reduce((s, p) => s + p.con, 0);
  const lai = no.reduce((s, p) => s + p.lai, 0);
  const qh = no.filter(p => p.qh);
  const tx = LIVE();
  const hnNo = tx.filter(t => t.loai === 'no' && t.ngay === today())
    .reduce((s, t) => s + t.tien, 0);
  const hnTra = tx.filter(t => t.loai === 'tra' && t.ngay === today())
    .reduce((s, t) => s + t.tien, 0);
  const thNo = tx.filter(t => t.loai === 'no'
    && t.ngay.startsWith(thisMonth())).reduce((s, t) => s + t.tien, 0);
  const thTra = tx.filter(t => t.loai === 'tra'
    && t.ngay.startsWith(thisMonth())).reduce((s, t) => s + t.tien, 0);
  const top = no.slice().sort((a, b) => b.con - a.con).slice(0, 3)
    .map(p => `${p.ten} ${fmtShort(p.con)}`).join(' • ');
  el.innerHTML = `<h3>📊 Tổng quan</h3>
    <div class="r"><span>Tổng đang nợ</span><b>${fmt(tong)}</b></div>
    <div class="r"><span>Số người đang nợ</span><b>${no.length}</b></div>
    <div class="r"><span>Khoản quá hạn</span>
      <b style="color:#8b1a1a">${qh.length}</b></div>
    <div class="r"><span>Lãi tạm tính cả sổ</span><b>~${fmt(lai)}</b></div>
    <div class="r"><span>Hôm nay: ghi nợ / thu</span>
      <b>${fmtShort(hnNo)} / ${fmtShort(hnTra)}</b></div>
    <div class="r"><span>Tháng này: ghi nợ / thu</span>
      <b>${fmtShort(thNo)} / ${fmtShort(thTra)}</b></div>
    <div class="top">🔝 Nợ nhiều: ${top || '—'}</div>`;
}

// ── hiển thị ────────────────────────────────────────────────
function render() {
  const all = nhom();
  const q = norm(qEl.value);
  const l = all.filter(p => (xemHetFlg || p.con > 0)
                  && (!q || norm(p.ten).includes(q)));
  const tong = all.reduce((s, p) => s + Math.max(0, p.con), 0);
  const nguoi = all.filter(p => p.con > 0).length;
  const nqh = all.filter(p => p.qh > 0).length;
  document.getElementById('tong').textContent = fmt(tong);
  document.getElementById('nguoi').textContent = nguoi;
  document.getElementById('qhan').innerHTML = nqh
    ? `<span class="qhan">⚠ ${nqh} khoản quá hạn</span>` : '';
  document.getElementById('bHet').textContent = xemHetFlg
    ? '📋 Chỉ xem đang nợ' : '📋 Xem cả đã trả hết';
  document.getElementById('dsTen').innerHTML = all
    .map(p => `<option value="${p.ten}">`).join('');
  const el = document.getElementById('list');
  if (!l.length) {
    el.innerHTML = '<div class="empty">Chưa có khoản nợ nào.<br>'
      + 'Bấm nút bên dưới để bắt đầu ghi.</div>';
    return;
  }
  el.innerHTML = l.map(p => {
    const meta = [`vay ${fmtShort(p.vay)}`];
    if (p.tra) meta.push(`trả ${fmtShort(p.tra)}`);
    if (p.lai > 50) meta.push(`lãi ~${fmtShort(p.lai)}`);
    if (p.han && p.con > 0) meta.push(`hẹn ${dday(p.han)}`);
    meta.push(`cập nhật ${dday(p.last.slice(0, 10))}`);
    const badge = p.con <= 0
      ? '<span class="badge b-ok">ĐÃ TRẢ HẾT</span>'
      : p.qh ? `<span class="badge b-qh">QUÁ HẠN ${p.qh} ngày</span>`
             : (p.lai > 50 ? '<span class="badge b-lai">CÓ LÃI</span>' : '');
    return `<div class="card" onclick="moDt('${p.k}')">
      <div class="n">${ICON[p.cn] || '📒'} ${p.ten}${p.sdt ? ` <span class="sdt">📞${p.sdt}</span>` : ''} ${badge}</div>
      <div class="c">${p.con > 0 ? fmt(p.con) : '0 ₫'}</div>
      <div class="meta">${meta.join(' • ')}</div>
    </div>`;
  }).join('');
  if (document.getElementById('tq').classList.contains('on'))
    tqHien(), document.getElementById('tq').classList.add('on');
}

function docJson(e) {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      const rows = j.db || j;
      if (!Array.isArray(rows)) throw 0;
      const byId = new Map(DB.map(t => [t.id, t]));
      let n = 0;
      rows.forEach(t => {
        if (!t.id) t.id = Date.now() + n;
        if (!byId.has(t.id)) { DB.push(t); pend(t.id); n++; }
      });
      if (j.phones) Object.assign(PHONES, j.phones);
      save(); render();
      toast(`Đã nhập ${n} ghi từ file backup`);
      dong3();
    } catch (x) { alert('File không đúng — chọn file backup của Sổ Nợ'); }
  };
  rd.readAsText(f);
  e.target.value = '';
}
// dữ liệu mẫu
function napDemo() {
  if (!confirm('Nạp 30 người nợ tiền gas làm dữ liệu mẫu?')) return;
  const names = ['chị Hai','anh Ba','cô Tư','chú Năm','bà Sáu',
    'cậu Bảy','dì Tám','anh Chín','chị Mười','bác Ba Sơn','anh Tý',
    'cô Út','chú Lợi','chị Hồng','anh Tâm','bà Ngoại Sáng','cô Lan',
    'anh Dũng','chị Thảo','chú Sáu Cờ','anh Vũ','cô Phượng',
    'bà Tư Đẹp','anh Kha','dì Sen','chú Hoành','chị Ngọc','anh Lực',
    'cô Gái','bác Năm Búng'];
  const gc = ['thay bình gas 12kg','thay gas','gas bếp',
    'thay bình gas quán','2 bình gas','gas + tiền lắp',
    'thay gas tháng này','nợ gas','thay bình gas mới','gas và công thay'];
  const gia = [380000, 390000, 400000, 410000, 420000, 450000];
  const sdtf = i => '09' + String(10000000 + i * 731).slice(0, 8);
  const R = () => Math.random();
  const now = Date.now();
  const iso = d => new Date(d).toISOString().slice(0, 10);
  const day = 864e5;
  let n = 0;
  names.forEach((ten, i) => {
    let ngay = now - (20 + Math.floor(R() * 85)) * day;
    const sdt = R() < .6 ? sdtf(i) : '';
    const lan = R() < .7 ? 1 : (R() < .75 ? 2 : 3);
    let tongVay = 0;
    for (let L = 0; L < lan; L++) {
      const tien = gia[Math.floor(R() * gia.length)]
        * (R() < .15 ? 2 : 1);
      const id = now + i * 10 + L;
      const t = {id, ten, tien, loai: 'no', cn: 'gas',
        gc: gc[Math.floor(R() * gc.length)],
        ngay: iso(ngay),
        gio: String(7 + Math.floor(R() * 12)).padStart(2, '0')
             + ':' + String(Math.floor(R() * 60)).padStart(2, '0')};
      if (R() < .4) t.han = iso(ngay + 30 * day);
      if (sdt) t.sdt = sdt;
      DB.push(t); pend(id); tongVay += tien; n++;
      ngay += (15 + Math.floor(R() * 25)) * day;
      if (ngay > now) ngay = now - Math.floor(R() * 5) * day;
    }
    const r = R();
    if (r < .2) {
      const id = now + i * 10 + 8;
      DB.push({id, ten, tien: tongVay, loai: 'tra',
               gc: 'trả tiền gas',
               ngay: iso(Math.min(ngay + 5 * day, now)), gio: '18:00'});
      pend(id); n++;
    } else if (r < .5) {
      const id = now + i * 10 + 8;
      DB.push({id, ten,
               tien: Math.round(tongVay * (.3 + R() * .3) / 1e4) * 1e4,
               loai: 'tra', gc: 'trả bớt tiền gas',
               ngay: iso(ngay), gio: '17:30'});
      pend(id); n++;
    }
    if (sdt) PHONES[nkey(ten)] = sdt;
  });
  save(); render(); dong3();
  toast(`Đã nạp ${n} giao dịch mẫu — xem thử nhé`);
}

// ── PIN ─────────────────────────────────────────────────────
const pin = () => localStorage.getItem(PINK) || '';
function caiPin() {
  const cur = pin();
  const p1 = prompt(cur ? 'Đổi mã PIN mới (4 số) — để trống giữ nguyên, gõ 0 để tắt PIN:'
                        : 'Đặt mã PIN 4 số để khóa app:');
  if (p1 === null || p1 === '') return;
  if (p1 === '0') {
    localStorage.removeItem(PINK);
    document.getElementById('bLock').style.display = 'none';
    toast('Đã tắt PIN'); return;
  }
  if (!/^\d{4}$/.test(p1)) { alert('PIN phải đúng 4 chữ số'); return; }
  localStorage.setItem(PINK, p1);
  document.getElementById('bLock').style.display = '';
  toast('Đã đặt PIN — lần sau mở app sẽ hỏi');
}
function khoaLai() { if (pin()) hoiPin(); }
let pinNhap = '';
function hoiPin() {
  pinNhap = ''; pinVe();
  document.getElementById('pinov').classList.add('on');
}
function pinVe() {
  document.getElementById('pindot').textContent =
    '●'.repeat(pinNhap.length) + '○'.repeat(4 - pinNhap.length);
}
(function padInit() {
  const pad = document.getElementById('pad');
  '123456789 0⌫'.split('').forEach(c => {
    if (c === ' ') { pad.appendChild(document.createElement('div')); return; }
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = () => {
      if (c === '⌫') pinNhap = pinNhap.slice(0, -1);
      else if (pinNhap.length < 4) pinNhap += c;
      pinVe();
      if (pinNhap.length === 4) {
        if (pinNhap === pin())
          document.getElementById('pinov').classList.remove('on');
        else { pinNhap = ''; pinVe(); toast('Sai PIN — thử lại'); }
      }
    };
    pad.appendChild(b);
  });
})();
if (pin()) { hoiPin(); document.getElementById('bLock').style.display = ''; }

// ── đồng bộ Google Sheets ───────────────────────────────────
const syncUrl = () => localStorage.getItem(SKEY) || '';
function caiSync() {
  const u = prompt(
    'Dán link Apps Script đồng bộ (từ Google Sheets của mẹ):',
    syncUrl());
  if (u === null) return;
  localStorage.setItem(SKEY, u.trim());
  PENDING = new Set(DB.map(t => t.id));
  save(); trySync();
  toast('Đã cài đồng bộ — dữ liệu đang đẩy lên Sheet');
}
async function trySync() {
  const u = syncUrl();
  if (!u || !navigator.onLine || !PENDING.size) { upSync(); return; }
  const rows = [...PENDING]
    .map(id => DB.find(t => t.id === id)).filter(Boolean);
  try {
    await fetch(u, {
      method: 'POST', redirect: 'follow',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({rows}),
    });
    rows.forEach(t => PENDING.delete(t.id));
    localStorage.setItem(PKEY, JSON.stringify([...PENDING]));
  } catch (e) { /* giữ hàng chờ */ }
  upSync();
}
async function pullSync(bao) {
  const u = syncUrl();
  if (!u || !navigator.onLine) { if (bao) alert('Chưa cài đồng bộ'); return; }
  try {
    const r = await fetch(u + '?all=1');
    const j = await r.json();
    const byId = new Map(DB.map(t => [t.id, t]));
    let doi = 0;
    (j.rows || []).forEach(t => {
      const cu = byId.get(t.id);
      if (!cu) { DB.push(t); doi++; }
      else if (!PENDING.has(t.id)
               && JSON.stringify(cu) !== JSON.stringify(t)) {
        Object.assign(cu, t); doi++;
      }
    });
    if (doi) { save(); render(); }
    if (bao) toast(doi ? 'Đã tải ' + doi + ' ghi từ Sheet về.'
                       : 'Sheet không có ghi mới.');
  } catch (e) { if (bao) alert('Không tải được — kiểm tra mạng/link.'); }
}
function upSync() {
  const el = document.getElementById('sync');
  if (!navigator.onLine)
    el.textContent = '💾 Lưu trên máy — đang MẤT MẠNG, vẫn ghi được';
  else if (!syncUrl())
    el.textContent = '💾 Lưu trên máy — chưa cài đồng bộ';
  else
    el.textContent = PENDING.size
      ? '⏳ ' + PENDING.size + ' mục đang chờ đồng bộ…'
      : '☁️ Đã đồng bộ lên Google Sheets';
}
window.addEventListener('online',
  () => { upSync(); trySync(); pullSync(); });
window.addEventListener('offline', upSync);
upSync(); trySync(); pullSync(); render();

// PWA offline
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});
